# 源配置。fetcher_type 决定 dispatch；config 段直接传给对应 Fetcher 构造器。
sources:
  - id: linux_do
    display_name: Linux.do
    fetcher_type: rss
    config:
      url: https://linux.do/latest.rss
      max_items: 30
    enabled: true

  # XHS — 走已装的 xiaohongshu skill。enable 前需先启动 MCP：
  #   ~/.claude/skills/xiaohongshu/scripts/start-mcp.sh
  #   ~/.claude/skills/xiaohongshu/scripts/status.sh   # 确认 logged_in: true
  #
  # ⚠️ 当前 disabled (2026-05-07)：XHS 后端对 post-detail 路径风控触发
  # （upstream xpzouying/xiaohongshu-mcp#627，作者承认是 XHS 限流），
  # 50 个串行 detail 调用全 isError，拖死 launchd 周期。enrich_detail
  # 先设 false 作为未来恢复时的安全默认（仅 search.sh，不抓正文）。
  # 等 24-48h 风控冷却后再 enabled: true 试一次。
  - id: xhs_events
    display_name: 小红书·AI活动搜索
    fetcher_type: xhs
    config:
      keywords:
        - AI 黑客松
        - AI meetup 深圳
        - AI 沙龙 深圳
        - AI 招募
        - AIGC 黑客松
      max_per_keyword: 10
      enrich_detail: false   # XHS 风控期 fallback：跳过 post-detail
    enabled: false

  # 微信公众号 — 通过本地 wewe-rss 暴露 RSS。
  #
  # 部署：
  #   cd deploy/wewe-rss && docker compose up -d
  #   open http://localhost:4000/dash   # 普通微信扫 QR 登录（不是微信读书），UI 里加公众号
  #
  # 自动生成条目（订阅完后跑）：
  #   python scripts/wewe_feeds_to_yaml.py >> config/sources.yaml
  #
  # 模板（占位，订完阅就把 <feed_id> 替换 + enabled 改 true）：
  #
  # - id: jiqizhixin
  #   display_name: 机器之心
  #   fetcher_type: rss
  #   config:
  #     url: http://localhost:4000/feeds/<feed_id>.atom?auth_code=<token>
  #     max_items: 30
  #   enabled: false
  #
  # - id: qbitai
  #   display_name: 量子位
  #   fetcher_type: rss
  #   config:
  #     url: http://localhost:4000/feeds/<feed_id>.atom?auth_code=<token>
  #     max_items: 30
  #   enabled: false
  #
  # - id: xinzhiyuan
