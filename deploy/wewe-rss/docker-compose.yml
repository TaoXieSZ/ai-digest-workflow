version: "3.9"

services:
  wewe-rss:
    image: cooderl/wewe-rss-sqlite:latest
    container_name: wewe-rss
    restart: unless-stopped
    ports:
      - "${WEWE_PORT:-4000}:4000"
    volumes:
      - ./data:/app/data
    environment:
      # Generate via `openssl rand -hex 32`
      - AUTH_CODE=${WEWE_AUTH_CODE:?set WEWE_AUTH_CODE in .env}
      # Set to true for SQLite (no external DB). Default for personal use.
      - DATABASE_TYPE=sqlite
      - DATABASE_URL=file:/app/data/wewe-rss.db
      # Optional: WeChat reading account auth (set via UI after first start)
      - SERVER_ORIGIN_URL=http://localhost:${WEWE_PORT:-4000}
      # Pull full article body, not just titles — needed for classifier/cluster.
      - FEED_MODE=fulltext
      # Strip HTML + base64 images from article body (otherwise feed = 30MB/10 articles).
      - ENABLE_CLEAN_HTML=true
